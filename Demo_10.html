<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>

</head>
<body>
    <select>
        <option selected value="">-- Select Your Course --</option>
        <Option value="1">MERN</Option>

        <Option value="4">PHP</Option>
    </select>

    <br><br>

    <input readonly type="text" placeholder="Amount to pay">

    <script>
        $(document).ready(function()
        {
            $("select").change(function()
            {   
                var x = $(this).val()
                var y = $("input").val()
                if(x == 1)
                {
                    $("input").val("5000")
                }
                else if(x == 2)
                {
                    $("input").val("6000")
                }
                else if(x == 3)
                {
                    $("input").val("7000")
                }
                else if(x == 4)
                {
                    $("input").val("4000")
                }
                else
                {
                    $("input").val("")

                }

            })
        })
    </script>

</html>
