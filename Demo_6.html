<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="JS/jquery-3.7.1.js"></script>
</head>
<body>
    <input type="number" id="txt1" placeholder="Enter pincode">
    <br><br>
    <button>Check</button>
    <p></p>

    <script>
        $(document).ready(function()
        {
            $("button").click(function()
            {
                var a = $("input").val()

                if(a.length == 6)
                {
                    $("p").text("Valid pincode !!")
                    $("p, input").css("color","green")
                    $("input").css({"border":"3px solid green"})
                }
                else
                {
                    $("p").text("Invalid pincode !!")
                    $("p, input").css("color","red")
                    $("input").css({"border":"3px solid red"})

                }
            })
        })
    </script>
</body>
</html>
