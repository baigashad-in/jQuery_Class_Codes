<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="JS/jquery-3.7.1.js"></script>
    <link rel="stylesheet" href="CSS_for_bootstrap/CSS/bootstrap.css">
</head>
<body>
    <button id="loginBtn">Login</button>
    <button id="RegisterBtn">Register</button>
    <button id="ForgetBtn">Forget Password</button>
    <br><br>
    <div class="container">
        <div id="row1" class="row justify-content-center">
            <div class="col-sm-3 shadow-lg p-4">
                <form>
                    <center><h2 class="text-primary">Login</h2></center>
                    <br>
                    <input type="text" class="form-control" placeholder="User name">
                    <br>
                    <input type="password" class="form-control"  placeholder="Password">
                    <br><br>
                    <input type="button" class="btn btn-primary" value="Login">
                </form>
            </div>
        </div>
        <div id="row2" class="row justify-content-center">
            <div class="col-sm-3 shadow-lg p-4">
                <form>
                    <center><h2 class="text-danger">Registration</h2></center>
                    <br>
                    <input type="text" class="form-control" placeholder="User name">
                    <br>
                    <input type="email" class="form-control" placeholder="Email">
                    <br>
                    <input type="password" class="form-control" placeholder="Password">
                    <br>
                    <input type="button" class="btn btn-danger" value="Register">
                </form>
            </div>
        </div>
        <div id="row3" class="row justify-content-center">
            <div class="col-sm-3 shadow-lg p-4">
                 <form>
                    <center><h3 class="text-warning">Forgot Password</h3></center>
                    <br>
                    <input type="email" class="form-control" placeholder="Enter Your Email">
                    <br><br>
                    <input type="button" class="btn btn-warning" value="Submit">
                </form>
            </div>
        </div>
    </div>
    
    
   

    <script>
        $(document).ready(function()
        {
                $("#row1").show("fast")
                $("#row2", "#row3").hide("fast")
            $("#loginBtn").click(function()
            {
                $("#row1").show("fast")
                $("#row2", "#row3").hide("fast")
            })
            $("#RegisterBtn").click(function()
            {
                $("#row2").show("fast")
                $("#row1", "#row3").hide("fast")
            })
            $("#ForgetBtn").click(function()
            {
                $("#row1", "#row2").hide("fast")
                $("#row3").show("fast")
            })
        })
    </script>

    <script src="CSS_for_bootstrap/JS/bootstrap.bundle.js"></script>
</body>
</html>
